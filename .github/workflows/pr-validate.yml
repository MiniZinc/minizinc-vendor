name: pr-validate

# On a PR that touches the manifest, a recipe, or resources, build only the
# affected dependencies to prove they build at their new pin. Nothing is
# published — a merge to main (publish.yml) does that.

on:
  pull_request:
    paths:
      - dependencies.toml
      - recipes/**
      - resources/**
      - scripts/**

# `contents: write` even though nothing is published here (publish: false below):
# build.yml declares it for its upload step, and a called workflow may only be
# equal to or more restrictive than its caller. Granting less fails the run at
# startup, before any job exists -- with no log to say why.
permissions:
  contents: write

jobs:
  changed:
    uses: ./.github/workflows/build.yml
    with:
      changed_ref: ${{ github.event.pull_request.base.sha }}
      publish: false
